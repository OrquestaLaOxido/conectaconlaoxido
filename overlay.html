<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Overlay OBS Orquesta</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>


<body class="overlay">


<div id="escenario"></div>



<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>
<script src="moderacion.js"></script>
<script src="avatar.js"></script>


<script>


const escenario =
document.getElementById("escenario");


let ultimoNonce = null;



refEnVivo().onSnapshot(snap=>{

  if(!snap.exists) return;

  let d = snap.data();

  if(!d.nonce || d.nonce === ultimoNonce) return;

  ultimoNonce = d.nonce;


  if(d.tipo==="mensaje"){

    mostrarMensaje(d);

  }


  if(d.tipo==="reaccion"){

    mostrarReaccion(d);

  }


  if(d.tipo==="foto"){

    mostrarFoto(d);

  }


  if(d.tipo==="emoji_lluvia"){

    lluviaEmoji(d.emoji);

  }


  if(d.tipo==="limpiar"){

    limpiar();

  }


}, err=>{

  console.error("Error escuchando Firestore:", err);

});




function bloqueIdentidad(d){


  if(!d.avatar && !d.nombre){

    return "";

  }


  let avatarBloque = avatarHTML(d.avatar, d.nombre, "avatarOverlay", "avatarOverlayInicial");


  let nombreHTML=
  d.nombre ?
  `<div class="nombreOverlay">${escapeHTML(d.nombre)}</div>` :
  "";


  return `
  <div class="identidad">
  ${avatarBloque}
  ${nombreHTML}
  </div>
  `;

}





function mostrarMensaje(d){


limpiar();


let caja=document.createElement("div");


caja.className="cartel entrada";



caja.innerHTML=`

${bloqueIdentidad(d)}

<div class="texto">
${escapeHTML(d.texto)}
</div>

`;



escenario.appendChild(caja);


ajustarTexto(
caja.querySelector(".texto")
);



setTimeout(()=>{

if(caja.parentNode){

limpiar();

}

},(d.tiempo||8)*1000);



}






function mostrarReaccion(d){


limpiar();


let caja=document.createElement("div");


caja.className="cartel entrada";



caja.innerHTML=`

${bloqueIdentidad(d)}

<div class="emojiGrande">
${d.emoji}
</div>

<div class="texto">
${escapeHTML(d.texto)}
</div>

`;



escenario.appendChild(caja);


setTimeout(()=>{

if(caja.parentNode){

limpiar();

}

},6000);


}






function ajustarTexto(t){


let tamaño=100;


t.style.fontSize=tamaño+"px";


while(
t.scrollHeight>240 &&
tamaño>20
){

tamaño-=5;

t.style.fontSize=tamaño+"px";

}


}





function lluviaEmoji(e){


limpiar();



for(let i=0;i<100;i++){


let emoji=document.createElement("div");


emoji.className="emoji";


emoji.innerText=e;


emoji.style.left=
Math.random()*100+"vw";


emoji.style.fontSize=
40+Math.random()*80+"px";


emoji.style.animationDuration=
3+Math.random()*5+"s";



escenario.appendChild(emoji);


}



setTimeout(()=>{

limpiar();

},12000);


}






function mostrarFoto(d){


limpiar();


let contenedor=document.createElement("div");

contenedor.className="entrada";

contenedor.style.display="flex";

contenedor.style.flexDirection="column";

contenedor.style.alignItems="center";


let img=document.createElement("img");


img.src=d.imagen;


img.className="fotoGrande";


contenedor.appendChild(img);


if(d.nombre){

let credito=document.createElement("div");

credito.className="nombreOverlay creditoFoto";

credito.textContent=d.nombre;

contenedor.appendChild(credito);

}


escenario.appendChild(contenedor);


}






function limpiar(){

escenario.innerHTML="";

}


</script>


</body>
</html>
